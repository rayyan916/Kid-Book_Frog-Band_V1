<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>青蛙樂隊 — 電子互動繪本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-mist: #dce8e2;
      --bg-paper: #f6f9f4;
      --sage-dark: #3f6257;
      --sage-mid: #638c7d;
      --sage-light: #a6c4b8;
      --cream: #fffdf7;
      --accent-sun: #f4b956;
      --accent-coral: #e57a68;
      --accent-blue: #6aa4c8;
      --accent-purple: #8f84b8;
      --shadow-soft: 0 10px 28px rgba(45, 74, 64, 0.14);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(circle at top left, #e7f1ec 0%, #cfe0d8 55%, #bfd4cb 100%);
      color: var(--sage-dark);
      overflow: hidden;
    }

    /* 通用畫面切換 */
    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .screen.active {
      display: flex;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ==================== 1. 封面頁 ==================== */
    #cover-screen {
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.65) 0%, transparent 45%),
        radial-gradient(circle at 82% 80%, rgba(166, 196, 184, 0.55) 0%, transparent 50%),
        linear-gradient(160deg, #ddeae3 0%, #bdd4ca 100%);
      overflow-y: auto;
    }

    .cover-card {
      position: relative;
      width: 100%;
      max-width: 780px;
      background: rgba(255, 253, 247, 0.92);
      border: 6px solid #ffffff;
      border-radius: 36px;
      box-shadow: 0 20px 50px rgba(47, 79, 68, 0.18);
      padding: clamp(24px, 5vw, 48px);
      text-align: center;
      overflow: hidden;
    }

    /* 水彩荷葉裝飾 */
    .cover-card::before,
    .cover-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: 0.28;
      pointer-events: none;
    }
    .cover-card::before {
      width: 220px; height: 220px;
      background: var(--sage-light);
      top: -80px; left: -70px;
    }
    .cover-card::after {
      width: 260px; height: 260px;
      background: var(--accent-sun);
      bottom: -110px; right: -80px;
    }

    .cover-badge {
      display: inline-block;
      background: #e3f0ea;
      color: var(--sage-dark);
      font-weight: 700;
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .cover-title {
      margin: 0;
      font-size: clamp(2.6rem, 7vw, 4.4rem);
      font-weight: 900;
      color: #2f5247;
      letter-spacing: 6px;
      text-shadow: 3px 4px 0 rgba(166, 196, 184, 0.55);
    }

    .cover-subtitle {
      margin: 10px 0 24px;
      font-size: clamp(1rem, 2.3vw, 1.25rem);
      color: #5b7c70;
      font-weight: 500;
    }

    .cover-illustration {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 14px;
      margin: 12px auto 30px;
      height: clamp(130px, 24vw, 190px);
    }

    .cover-frog {
      animation: frogBob 2.4s ease-in-out infinite;
    }
    .cover-frog:nth-child(2) { animation-delay: 0.4s; }
    .cover-frog:nth-child(3) { animation-delay: 0.8s; }

    @keyframes frogBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .cover-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    @media (max-width: 560px) {
      .cover-actions { grid-template-columns: 1fr; }
    }

    .big-entry-btn {
      border: none;
      border-radius: 22px;
      padding: 20px 18px;
      font-family: inherit;
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.14), 0 12px 24px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .big-entry-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.14);
    }
    .big-entry-btn small {
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0.92;
    }
    .btn-warmup {
      background: linear-gradient(135deg, #62a3c7, #4886ab);
    }
    .btn-story {
      background: linear-gradient(135deg, #67a87e, #478761);
    }

    /* ==================== 頂部導覽列 ==================== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(255, 253, 247, 0.92);
      border-bottom: 2px solid rgba(99, 140, 125, 0.2);
      gap: 10px;
      flex-shrink: 0;
      z-index: 20;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar-title {
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      font-weight: 900;
      color: var(--sage-dark);
      white-space: nowrap;
    }
    .nav-pill {
      border: 2px solid #c5dbd1;
      background: #fff;
      color: var(--sage-dark);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-pill:hover { background: #edf6f1; }
    .nav-pill.primary {
      background: var(--sage-mid);
      border-color: var(--sage-mid);
      color: #fff;
    }

    /* ==================== 2. 熱身活動區 ==================== */
    .warmup-layout {
      flex: 1;
      display: flex;
      min-height: 0;
      padding: 16px;
      gap: 16px;
    }

    /* 舞台區 */
    .warmup-stage {
      flex: 1;
      position: relative;
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, #b8d3c9 0%, #e4f0ea 100%);
      border: 5px solid #ffffff;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 18px;
      transition: background 0.6s ease;
    }

    /* 不同天氣背景 */
    .warmup-stage.weather-drizzle { background: linear-gradient(180deg, #9fb9b5 0%, #d7e6e2 100%); }
    .warmup-stage.weather-drops   { background: linear-gradient(180deg, #7fa6b3 0%, #c8dfe6 100%); }
    .warmup-stage.weather-heavy   { background: linear-gradient(180deg, #527382 0%, #8ea8b5 100%); }
    .warmup-stage.weather-thunder { background: linear-gradient(180deg, #2d3b4e 0%, #526175 100%); }
    .warmup-stage.weather-sunny   { background: linear-gradient(180deg, #87cef0 0%, #fff2c2 100%); }

    #weather-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .lightning-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
    }
    .lightning-flash.flash {
      animation: flashAnim 0.45s ease;
    }
    @keyframes flashAnim {
      0% { opacity: 0; }
      20% { opacity: 0.85; }
      45% { opacity: 0.1; }
      65% { opacity: 0.7; }
      100% { opacity: 0; }
    }

    .weather-word-box {
      position: relative;
      z-index: 5;
      text-align: center;
      margin-top: 6px;
    }
    .weather-big-text {
      font-size: clamp(3rem, 9vw, 6.2rem);
      font-weight: 900;
      letter-spacing: 8px;
      color: #ffffff;
      text-shadow:
        0 4px 0 rgba(45, 74, 64, 0.35),
        0 10px 24px rgba(0, 0, 0, 0.22);
      margin: 0;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .weather-big-text.pop {
      transform: scale(1.12);
    }
    .weather-desc {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      color: var(--sage-dark);
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      font-weight: 700;
    }

    /* 小青蛙反應區 */
    .frog-stage-wrap {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
    }
    .frog-speech {
      background: #fffdf7;
      border: 3px solid var(--sage-mid);
      border-radius: 20px;
      padding: 10px 20px;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      font-weight: 700;
      color: var(--sage-dark);
      margin-bottom: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      position: relative;
    }
    .frog-speech::after {
      content: "";
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: var(--sage-mid) transparent transparent;
    }

    #warmup-frog-svg {
      width: clamp(170px, 32vw, 260px);
      height: auto;
      filter: drop-shadow(0 12px 16px rgba(0,0,0,0.16));
      transition: transform 0.3s ease;
    }

    /* 青蛙動畫狀態 */
    .frog-anim-drizzle { animation: sway 2.8s ease-in-out infinite; }
    .frog-anim-drops   { animation: hopGentle 1.2s ease-in-out infinite; }
    .frog-anim-heavy   { animation: bounceFast 0.7s ease-in-out infinite; }
    .frog-anim-thunder { animation: shiver 0.25s linear infinite; }
    .frog-anim-sunny   { animation: happyDance 1.1s ease-in-out infinite; }

    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes hopGentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes bounceFast {
      0%, 100% { transform: translateY(0) scaleY(1); }
      45% { transform: translateY(-18px) scaleY(1.06); }
      85% { transform: translateY(2px) scaleY(0.95); }
    }
    @keyframes shiver {
      0%, 100% { transform: translate(0, 0) scale(0.95); }
      25% { transform: translate(-4px, 2px) scale(0.95); }
      75% { transform: translate(4px, -2px) scale(0.95); }
    }
    @keyframes happyDance {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-16px) rotate(4deg); }
    }

    /* 右側控制面板（手機自動變底部橫列） */
    .warmup-controls {
      width: 240px;
      background: rgba(255, 253, 247, 0.94);
      border-radius: var(--radius-lg);
      border: 4px solid #fff;
      box-shadow: var(--shadow-soft);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .controls-label {
      font-size: 0.95rem;
      font-weight: 900;
      color: #5b7c70;
      text-align: center;
      margin-bottom: 2px;
    }
    .weather-btn {
      border: 3px solid transparent;
      border-radius: 16px;
      padding: 14px 12px;
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.14);
      transition: transform 0.12s ease, border-color 0.2s ease;
    }
    .weather-btn:active { transform: translateY(3px); }
    .weather-btn.active {
      border-color: #2c4a40;
      transform: scale(1.03);
    }
    .wb-drizzle { background: linear-gradient(135deg, #86b3ad, #64968f); }
    .wb-drops   { background: linear-gradient(135deg, #6ba6c4, #4b87a8); }
    .wb-heavy   { background: linear-gradient(135deg, #4b7494, #335875); }
    .wb-thunder { background: linear-gradient(135deg, #5d5785, #3e3861); }
    .wb-sunny   { background: linear-gradient(135deg, #f5b642, #e09124); }
    .wb-stop    {
      background: #eef3f0;
      color: #4f6b61;
      font-size: 1rem;
      padding: 10px;
      margin-top: auto;
      box-shadow: none;
      border: 2px solid #c9dcd3;
    }

    @media (max-width: 820px) {
      .warmup-layout {
        flex-direction: column;
        padding: 10px;
        gap: 10px;
      }
      .warmup-controls {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        padding: 10px;
        gap: 8px;
      }
      .controls-label { display: none; }
      .weather-btn {
        flex: 1 1 30%;
        min-width: 100px;
        padding: 10px 8px;
        font-size: 1rem;
      }
      .wb-stop { margin-top: 0; flex: 1 1 30%; }
    }

    /* ==================== 3. 故事閱讀區 ==================== */
    .story-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 10px 14px 12px;
      gap: 10px;
    }

    .book-viewport {
      flex: 1;
      position: relative;
      background: #273c36;
      border-radius: var(--radius-lg);
      border: 5px solid #ffffff;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      touch-action: none;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .book-viewport:active { cursor: grabbing; }

    #book-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transform-origin: center center;
      transition: transform 0.08s ease-out;
      pointer-events: none;
      will-change: transform;
    }

    /* 圖片載入失敗提示 */
    .img-fallback {
      display: none;
      color: #e4f0ea;
      text-align: center;
      padding: 20px;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    /* 浮動縮放與左右移動工具列 */
    .zoom-toolbar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: rgba(255, 253, 247, 0.9);
      padding: 6px 8px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }
    .tool-btn {
      border: none;
      background: #e3f0ea;
      color: var(--sage-dark);
      font-family: inherit;
      font-weight: 900;
      font-size: 0.95rem;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tool-btn:hover { background: #cfe3da; }
    .tool-btn:active { transform: scale(0.94); }

    /* 頁數徽章 */
    .page-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: rgba(255, 253, 247, 0.92);
      color: var(--sage-dark);
      font-weight: 900;
      font-size: 1rem;
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    }

    /* 音效氣泡提示 */
    .sfx-toast {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(255, 253, 247, 0.96);
      color: var(--sage-dark);
      border: 3px solid var(--accent-sun);
      padding: 10px 22px;
      border-radius: 999px;
      font-size: clamp(1.1rem, 2.8vw, 1.5rem);
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 15;
      white-space: nowrap;
    }
    .sfx-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 底部控制欄：翻頁 + 音效 + 第10頁歌曲 */
    .story-bottom-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 253, 247, 0.94);
      border: 3px solid #ffffff;
      border-radius: 20px;
      padding: 10px 14px;
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
    }

    .nav-group, .sfx-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .story-btn {
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.14);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .story-btn:active { transform: translateY(2px); }
    .story-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-first { background: #7f9c91; }
    .btn-prev  { background: #5a8c7b; }
    .btn-next  { background: #3f7865; }

    .btn-sfx-frog { background: linear-gradient(135deg, #6ab06e, #488c4d); }
    .btn-sfx-rain { background: linear-gradient(135deg, #62a5cc, #4384ab); }
    .btn-sfx-bird { background: linear-gradient(135deg, #f0a848, #d68724); }

    /* 第 10 頁專屬歌曲按鈕 */
    .btn-p10-song {
      display: none;
      background: linear-gradient(135deg, #e86f7c, #cc4e60);
      animation: pulseGlow 1.6s infinite;
    }
    .btn-p10-song.visible {
      display: inline-flex;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 4px 0 rgba(0,0,0,0.16), 0 0 0 0 rgba(232, 111, 124, 0.55); }
      50% { box-shadow: 0 4px 0 rgba(0,0,0,0.16), 0 0 0 10px rgba(232, 111, 124, 0); }
    }

    @media (max-width: 640px) {
      .story-bottom-bar {
        justify-content: center;
        padding: 8px;
        gap: 8px;
      }
      .story-btn {
        padding: 8px 11px;
        font-size: 0.88rem;
      }
      .zoom-toolbar {
        top: auto;
        bottom: 10px;
        right: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- ==================== 1. 封面頁 ==================== -->
  <section id="cover-screen" class="screen active">
    <div class="cover-card">
      <div class="cover-badge">電子互動繪本</div>
      <h1 class="cover-title">青蛙樂隊</h1>
      <p class="cover-subtitle">聽聽雨聲、認識天氣，一起用音樂喚醒太陽吧！</p>

      <!-- 繪本風小青蛙插畫 -->
      <div class="cover-illustration" aria-hidden="true">
        <svg class="cover-frog" width="110" height="130" viewBox="0 0 120 140">
          <ellipse cx="60" cy="126" rx="44" ry="10" fill="#a6c4b8" opacity="0.6"/>
          <ellipse cx="60" cy="86" rx="34" ry="38" fill="#77a86b"/>
          <ellipse cx="62" cy="92" rx="22" ry="27" fill="#f3f6e7"/>
          <circle cx="44" cy="54" r="9" fill="#2c3e35"/>
          <circle cx="76" cy="54" r="9" fill="#2c3e35"/>
          <circle cx="42" cy="51" r="2.5" fill="#fff"/>
          <circle cx="74" cy="51" r="2.5" fill="#fff"/>
          <circle cx="38" cy="68" r="6" fill="#e57a68" opacity="0.75"/>
          <circle cx="82" cy="68" r="6" fill="#e57a68" opacity="0.75"/>
          <path d="M48 70 Q60 80 72 70" stroke="#2c3e35" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 小喇叭 -->
          <path d="M84 74 L112 64 L112 84 Z" fill="#d99a43"/>
        </svg>
        <svg class="cover-frog" width="135" height="155" viewBox="0 0 140 160">
          <ellipse cx="70" cy="144" rx="52" ry="11" fill="#a6c4b8" opacity="0.6"/>
          <ellipse cx="70" cy="96" rx="42" ry="45" fill="#a89458"/>
          <ellipse cx="72" cy="102" rx="28" ry="33" fill="#faf7eb"/>

  <script>
    /* ==================== 基本設定 ==================== */
    const PAGES = [
      "01-IMG_0487_cropped.jpg",
      "02-IMG_0488_cropped.jpg",
      "03-IMG_0489_cropped.jpg",
      "04-IMG_0490_cropped.jpg",
      "05-IMG_0491_cropped.jpg",
      "06-IMG_0492_cropped.jpg",
      "07-IMG_0493_cropped.jpg",
      "08-IMG_0494_cropped.jpg",
      "09-IMG_0495_cropped.jpg",
      "10-IMG_0496_cropped.jpg",
      "11-IMG_0497_cropped.jpg",
      "12-IMG_0498_cropped.jpg"
    ];

    let currentPage = 0;

    /* ==================== 畫面切換 ==================== */
    function goScreen(screenId) {
      stopWeatherSound();
      stopPage10Song();
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if (screenId === 'warmup-screen') {
        resizeWeatherCanvas();
      } else if (screenId === 'story-screen') {
        renderPage();
      }
    }

    /* ==================== Web Audio 音效引擎 ==================== */
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // 氣泡提示
    let toastTimer = null;
    function showToast(text) {
      const toast = document.getElementById('sfx-toast');
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
    }

    // 1. 青蛙音效：「呱呱、呱呱」
    function playFrogSFX() {
      showToast('🐸 呱呱、呱呱！');
      const ctx = getAudioCtx();
      const times = [0, 0.22, 0.58, 0.80];
      times.forEach(offset => {
        const t = ctx.currentTime + offset;
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(340, t + 0.08);
        osc.frequency.exponentialRampToValueAtTime(140, t + 0.16);

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(650, t);
        filter.Q.value = 3.5;

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.32, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.17);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.18);
      });
    }

    // 2. 雨滴音效：「滴答、滴答」
    function playRainSFX() {
      showToast('💧 滴答、滴答！');
      const ctx = getAudioCtx();
      const notes = [
        { t: 0.0, f1: 950, f2: 1450 },
        { t: 0.24, f1: 720, f2: 1100 },
        { t: 0.56, f1: 980, f2: 1520 },
        { t: 0.80, f1: 700, f2: 1080 }
      ];
      notes.forEach(n => {
        const t = ctx.currentTime + n.t;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(n.f1, t);
        osc.frequency.exponentialRampToValueAtTime(n.f2, t + 0.07);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.28, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
      });
    }

    // 3. 小鳥音效：「吱吱、喳喳」
    function playBirdSFX() {
      showToast('🐦 吱吱、喳喳！');
      const ctx = getAudioCtx();
      const chirps = [
        { t: 0.0,  f1: 2400, f2: 3500 },
        { t: 0.18, f1: 2500, f2: 3600 },
        { t: 0.48, f1: 3100, f2: 2200 },
        { t: 0.66, f1: 3000, f2: 2100 }
      ];
      chirps.forEach(c => {
        const t = ctx.currentTime + c.t;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(c.f1, t);
        osc.frequency.exponentialRampToValueAtTime(c.f2, t + 0.11);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.22, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.14);
      });
    }

    /* ==================== 第 10 頁專屬音樂 ==================== */
    const p10Audio = document.getElementById('page10-audio');
    const p10Btn = document.getElementById('btn-p10-song');
    let isPlayingP10 = false;
    let fallbackMelodyTimer = null;

    function togglePage10Song() {
      if (isPlayingP10) {
        stopPage10Song();
      } else {
        isPlayingP10 = true;
        p10Btn.textContent = '⏸️ 暫停歌曲';
        showToast('🎵 大家一起唱歌喚醒太陽！');
        p10Audio.currentTime = 0;
        const playPromise = p10Audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // 若資料夾尚未放入 song.mp3，自動播放內建八音盒版《小星星》作備援
            playFallbackTwinkle();
          });
        }
      }
    }

    function stopPage10Song() {
      isPlayingP10 = false;
      p10Audio.pause();
      p10Audio.currentTime = 0;
      clearTimeout(fallbackMelodyTimer);
      if (p10Btn) p10Btn.textContent = '🎵 播放歌曲';
    }

    p10Audio.addEventListener('ended', () => {
      isPlayingP10 = false;
      p10Btn.textContent = '🎵 播放歌曲';
    });

    function playFallbackTwinkle() {
      const ctx = getAudioCtx();
      const melody = [
        261.6, 261.6, 392.0, 392.0, 440.0, 440.0, 392.0, 0,
        349.2, 349.2, 329.6, 329.6, 293.7, 293.7, 261.6, 0
      ];
      let idx = 0;
      function step() {
        if (!isPlayingP10) return;
        const freq = melody[idx % melody.length];
        if (freq > 0) {
          const t = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.18, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.45);
        }
        idx++;
        fallbackMelodyTimer = setTimeout(step, 460);
      }
      step();
    }

    /* ==================== 熱身活動：天氣動畫與聲音 ==================== */
    const WEATHER_CONFIG = {
      drizzle: {
        title: "毛毛雨",
        desc: "細細的雨絲輕輕飄下來",
        speech: "呱～毛毛雨涼涼的，好舒服呀！",
        frogClass: "frog-anim-drizzle",
        umbrella: true, sunglasses: false, arms: "normal", eyes: "normal", mouth: "happy"
      },
      drops: {
        title: "小雨滴",
        desc: "滴答、滴答，雨滴落在荷葉上",
        speech: "呱呱！小雨滴掉下來了，我來接住你！",
        frogClass: "frog-anim-drops",
        umbrella: true, sunglasses: false, arms: "up", eyes: "normal", mouth: "happy"
      },
      heavy: {
        title: "大雨點",
        desc: "嘩啦啦！大雨點不斷落下來",
        speech: "呱呱呱！好大的雨啊，一起踩水窪吧！",
        frogClass: "frog-anim-heavy",
        umbrella: false, sunglasses: false, arms: "up", eyes: "normal", mouth: "o"
      },
      thunder: {
        title: "行雷閃電",
        desc: "轟隆隆！閃電劃破天空",
        speech: "哇呀！好大聲的雷聲，快摀住耳朵！",
        frogClass: "frog-anim-thunder",
        umbrella: false, sunglasses: false, arms: "scared", eyes: "scared", mouth: "o"
      },
      sunny: {
        title: "天晴",
        desc: "太陽公公出來了，天氣真暖和！",
        speech: "耶！天晴了，可以出去玩耍和唱歌囉！",
        frogClass: "frog-anim-sunny",
        umbrella: false, sunglasses: true, arms: "up", eyes: "normal", mouth: "happy"
      }
    };

    let currentWeather = null;
    let weatherSoundNodes = [];
    let weatherInterval = null;

    function setWeather(type) {
      currentWeather = type;
      const cfg = WEATHER_CONFIG[type];

      // 更新按鈕狀態
      document.querySelectorAll('.weather-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.weather === type);
      });

      // 更新背景與大字
      const stage = document.getElementById('warmup-stage');
      stage.className = 'warmup-stage weather-' + type;

      const bigText = document.getElementById('weather-big-text');
      bigText.textContent = cfg.title;
      bigText.classList.remove('pop');
      void bigText.offsetWidth;
      bigText.classList.add('pop');

      document.getElementById('weather-desc').textContent = cfg.desc;
      document.getElementById('frog-speech').textContent = cfg.speech;

      // 更新小青蛙表情與道具
      const svg = document.getElementById('warmup-frog-svg');
      svg.setAttribute('class', cfg.frogClass);
      document.getElementById('prop-umbrella').style.display = cfg.umbrella ? 'block' : 'none';
      document.getElementById('prop-sunglasses').style.display = cfg.sunglasses ? 'block' : 'none';

      document.getElementById('arms-normal').style.display = cfg.arms === 'normal' ? 'block' : 'none';
      document.getElementById('arms-up').style.display = cfg.arms === 'up' ? 'block' : 'none';
      document.getElementById('arms-scared').style.display = cfg.arms === 'scared' ? 'block' : 'none';

      document.getElementById('eyes-normal').style.display = cfg.eyes === 'normal' ? 'block' : 'none';
      document.getElementById('eyes-scared').style.display = cfg.eyes === 'scared' ? 'block' : 'none';

      document.getElementById('mouth-happy').style.display = cfg.mouth === 'happy' ? 'block' : 'none';
      document.getElementById('mouth-o').style.display = cfg.mouth === 'o' ? 'block' : 'none';

      // 啟動粒子與聲音
      initWeatherParticles(type);
      playWeatherSound(type);
    }

    function stopWeatherSound() {
      weatherSoundNodes.forEach(n => {
        try { n.stop(); } catch(e) {}
        try { n.disconnect(); } catch(e) {}
      });
      weatherSoundNodes = [];
      clearInterval(weatherInterval);
      weatherInterval = null;
    }

    function createNoiseBuffer(ctx) {
      const bufferSize = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    function playWeatherSound(type) {
      stopWeatherSound();
      const ctx = getAudioCtx();

      if (type === 'drizzle' || type === 'heavy' || type === 'thunder') {
        const noise = ctx.createBufferSource();
        noise.buffer = createNoiseBuffer(ctx);
        noise.loop = true;

        const filter = ctx.createBiquadFilter();
        filter.type = type === 'drizzle' ? 'highpass' : 'lowpass';
        filter.frequency.value = type === 'drizzle' ? 2400 : (type === 'heavy' ? 1200 : 900);

        const gain = ctx.createGain();
        gain.gain.value = type === 'drizzle' ? 0.04 : (type === 'heavy' ? 0.16 : 0.14);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
        weatherSoundNodes.push(noise, filter, gain);
      }

      if (type === 'drops') {
        const playDrop = () => {
          const t = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const base = 750 + Math.random() * 550;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(base, t);
          osc.frequency.exponentialRampToValueAtTime(base * 1.5, t + 0.06);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.18, t + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.13);
        };
        playDrop();
        weatherInterval = setInterval(playDrop, 340);
      }

      if (type === 'thunder') {
        const triggerThunder = () => {
          const flash = document.getElementById('lightning-flash');
          flash.classList.remove('flash');
          void flash.offsetWidth;
          flash.classList.add('flash');

          const t = ctx.currentTime;
          const noise = ctx.createBufferSource();
          noise.buffer = createNoiseBuffer(ctx);
          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(220, t);
          filter.frequency.exponentialRampToValueAtTime(55, t + 1.6);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.55, t + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 1.8);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          noise.start(t);
          noise.stop(t + 1.85);
        };
        triggerThunder();
        weatherInterval = setInterval(triggerThunder, 3600);
      }

      if (type === 'sunny') {
        const playSunnyChime = () => {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((f, i) => {
            const t = ctx.currentTime + i * 0.14;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.12, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.46);
          });
        };
        playSunnyChime();
        weatherInterval = setInterval(playSunnyChime, 3200);
      }
    }

    /* 天氣 Canvas 視覺動畫 */
    const wCanvas = document.getElementById('weather-canvas');
    const wCtx = wCanvas.getContext('2d');
    let particles = [];

    function resizeWeatherCanvas() {
      const stage = document.getElementById('warmup-stage');
      if (!stage) return;
      wCanvas.width = stage.clientWidth;
      wCanvas.height = stage.clientHeight;
    }
    window.addEventListener('resize', resizeWeatherCanvas);

    function initWeatherParticles(type) {
      resizeWeatherCanvas();
      particles = [];
      let count = 0;
      if (type === 'drizzle') count = 55;
      if (type === 'drops')   count = 35;
      if (type === 'heavy')   count = 130;
      if (type === 'thunder') count = 150;

      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * wCanvas.width,
          y: Math.random() * wCanvas.height,
          speed: type === 'drizzle' ? 4 + Math.random() * 2 :
                 type === 'drops'   ? 5 + Math.random() * 3 :
                                      13 + Math.random() * 6,
          len: type === 'drizzle' ? 10 : (type === 'drops' ? 8 : 22)
        });
      }
    }

    function animateWeather() {
      wCtx.clearRect(0, 0, wCanvas.width, wCanvas.height);

      if (currentWeather === 'sunny') {
        // 畫太陽與光芒
        const cx = wCanvas.width - 80;
        const cy = 75;
        wCtx.save();
        wCtx.beginPath();
        wCtx.arc(cx, cy, 38, 0, Math.PI * 2);
        wCtx.fillStyle = '#ffd54f';
        wCtx.fill();
        wCtx.strokeStyle = 'rgba(255, 224, 102, 0.75)';
        wCtx.lineWidth = 6;
        const rot = Date.now() * 0.0005;
        for (let i = 0; i < 12; i++) {
          const a = rot + (i * Math.PI) / 6;
          wCtx.beginPath();
          wCtx.moveTo(cx + Math.cos(a) * 48, cy + Math.sin(a) * 48);
          wCtx.lineTo(cx + Math.cos(a) * 64, cy + Math.sin(a) * 64);
          wCtx.stroke();
        }
        wCtx.restore();
      } else if (particles.length > 0) {
        wCtx.strokeStyle = currentWeather === 'thunder' ? 'rgba(220,235,255,0.65)' : 'rgba(255,255,255,0.65)';
        wCtx.fillStyle = 'rgba(255,255,255,0.75)';
        wCtx.lineWidth = currentWeather === 'drizzle' ? 1.2 : 2.2;

        particles.forEach(p => {
          if (currentWeather === 'drops') {
            wCtx.beginPath();
            wCtx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            wCtx.fill();
          } else {
            wCtx.beginPath();
            wCtx.moveTo(p.x, p.y);
            wCtx.lineTo(p.x - 2, p.y + p.len);
            wCtx.stroke();
          }
          p.y += p.speed;
          if (p.y > wCanvas.height) {
            p.y = -20;
            p.x = Math.random() * wCanvas.width;
          }
        });
      }
      requestAnimationFrame(animateWeather);
    }
    animateWeather();

    /* ==================== 故事閱讀：翻頁與圖片縮放拖曳 ==================== */
    const bookImg = document.getElementById('book-image');
    const viewport = document.getElementById('book-viewport');
    const fallbackBox = document.getElementById('img-fallback');
    const missingFileSpan = document.getElementById('missing-filename');

    let scale = 1;
    let posX = 0;
    let posY = 0;

    function updateTransform() {
      bookImg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    function resetView() {
      scale = 1;
      posX = 0;
      posY = 0;
      updateTransform();
    }

    function zoomImage(delta) {
      scale = Math.min(3.5, Math.max(0.8, +(scale + delta).toFixed(2)));
      updateTransform();
    }

    function panImage(dx, dy) {
      posX += dx;
      posY += dy;
      updateTransform();
    }

    function renderPage() {
      stopPage10Song();
      resetView();
      const filename = PAGES[currentPage];
      fallbackBox.style.display = 'none';
      bookImg.style.display = 'block';
      bookImg.src = filename;

      document.getElementById('page-badge').textContent = `第 ${currentPage + 1} / ${PAGES.length} 頁`;
      document.getElementById('btn-prev').disabled = currentPage === 0;
      document.getElementById('btn-first').disabled = currentPage === 0;
      document.getElementById('btn-next').disabled = currentPage === PAGES.length - 1;

      // 第 10 頁（索引 9）顯示專屬歌曲按鈕
      p10Btn.classList.toggle('visible', currentPage === 9);
    }

    bookImg.onerror = () => {
      bookImg.style.display = 'none';
      missingFileSpan.textContent = PAGES[currentPage];
      fallbackBox.style.display = 'block';
    };

    function changePage(step) {
      const next = currentPage + step;
      if (next >= 0 && next < PAGES.length) {
        currentPage = next;
        renderPage();
      }
    }

    function goToPage(index) {
      currentPage = index;
      renderPage();
    }

    // 滑鼠拖曳與滾輪縮放
    let isDragging = false;
    let startX = 0, startY = 0;

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.zoom-toolbar')) return;
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      updateTransform();
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoomImage(e.deltaY < 0 ? 0.15 : -0.15);
    }, { passive: false });

    // 平板 / 手機觸控：單指拖曳、雙指縮放
    let touchDist = 0;
    viewport.addEventListener('touchstart', (e) => {
      if (e.target.closest('.zoom-toolbar')) return;
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX - posX;
        startY = e.touches[0].clientY - posY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      if (e.target.closest('.zoom-toolbar')) return;
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        updateTransform();
      } else if (e.touches.length === 2) {
        const newDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (touchDist > 0) {
          const diff = (newDist - touchDist) * 0.008;
          zoomImage(diff);
        }
        touchDist = newDist;
      }
    }, { passive: false });

    viewport.addEventListener('touchend', () => {
      isDragging = false;
      touchDist = 0;
    });

    // 鍵盤左右鍵翻頁（電腦使用更方便）
    window.addEventListener('keydown', (e) => {
      if (!document.getElementById('story-screen').classList.contains('active')) return;
      if (e.key === 'ArrowRight') changePage(1);
      if (e.key === 'ArrowLeft') changePage(-1);
    });
  </script>
</body>
